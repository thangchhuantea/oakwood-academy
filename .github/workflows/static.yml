  <title>Oakwood Academy - Bloomington, IN</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
    header, footer { background-color: #003366; color: white; padding: 1em 2em; }
    nav a { color: white; margin: 0 15px; text-decoration: none; }
    .container { padding: 2em; max-width: 1000px; margin: auto; background-color: white; }
    h1, h2 { color: #003366; }
    .staff { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1em; }
    .staff-member { border: 1px solid #ccc; padding: 1em; border-radius: 8px; background-color: #fafafa; }
  </style>
