  <main class="container">
    <section id="home">
      <h2>Welcome to Oakwood Academy</h2>
      <p>Located in Bloomington, Indiana, Oakwood Academy provides a high-quality, student-centered education in a nurturing environment. Our goal is to develop confident, lifelong learners prepared to thrive in a diverse and changing world.</p>
    </section>

    <section id="about">
      <h2>About Us</h2>
      <p>Founded in 1995, Oakwood Academy serves grades K-12 and is dedicated to academic excellence, character development, and community engagement. We are proud to be a pillar of the Bloomington educational community.</p>
    </section>

    <section id="academics">
      <h2>Academics</h2>
      <ul>
        <li><strong>Elementary School (K-5):</strong> Core focus on literacy, numeracy, science, and social skills.</li>
        <li><strong>Middle School (6-8):</strong> Critical thinking, STEM, and personal development.</li>
        <li><strong>High School (9-12):</strong> College prep, AP courses, and career pathways.</li>
      </ul>
    </section>

    <section id="admissions">
      <h2>Admissions</h2>
      <p>Enrollment for the 2025–2026 academic year is now open. Interested families can apply online or schedule a school tour. Requirements include transcripts, an interview, and teacher recommendations.</p>
    </section>

    <section id="staff">
